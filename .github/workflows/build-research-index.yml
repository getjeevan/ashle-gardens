name: Build Research Index

on:
  push:
    branches:
      - main
    paths:
      - 'docs-raw/**'
      - 'build_research_index.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate research-data.json
        run: python build_research_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add research-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update research-data.json" && git push)
